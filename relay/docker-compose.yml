# One-command deploy with automatic HTTPS:
#
#   cp .env.example .env    # set RELAY_DOMAIN (its DNS must point at this server)
#   docker compose up -d

services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
