name: Companion
options:
  bundleIdPrefix: dev.companion
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  # libghostty prebuilt for Apple platforms, at the revision Heeler pins.
  # Fetched by scripts/fetch-libghostty.sh (Xcode's own download can hang).
  GhosttyTerminal:
    path: Vendor/libghostty-spm
targets:
  Companion:
    type: application
    platform: iOS
    sources: [Companion]
    # Signing.xcconfig optionally includes the git-ignored Local.xcconfig
    # (DEVELOPMENT_TEAM, BUNDLE_ID_SUFFIX); see README.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: GhosttyTerminal
    info:
      # Generated by XcodeGen; merged with the build-setting keys below.
      path: Companion/Info.plist
      properties:
        CFBundleURLTypes:
          # `companion://pair?…` from the QR code `companion-gateway pair` shows.
          - CFBundleURLName: dev.companion.app
            CFBundleURLSchemes: [companion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.companion.app$(BUNDLE_ID_SUFFIX)
        # Home-screen name; the project, bundle ID and URL scheme stay "companion".
        INFOPLIST_KEY_CFBundleDisplayName: Collie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [CompanionTests, CompanionUITests]
  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CompanionTests
        excludes: [Fixtures]
      # A folder reference keeps the captures' directory layout in the bundle.
      - path: CompanionTests/Fixtures
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - target: Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.companion.tests$(BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
  CompanionUITests:
    # Run through scripts/ui-test.sh, which starts a throwaway Gateway.
    type: bundle.ui-testing
    platform: iOS
    sources: [CompanionUITests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - target: Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.companion.uitests$(BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
