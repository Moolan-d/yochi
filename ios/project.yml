name: Companion
options:
  bundleIdPrefix: dev.companion
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  # libghostty prebuilt for Apple platforms, at the revision Heeler pins.
  # Fetched by scripts/fetch-libghostty.sh (Xcode's own download can hang).
  GhosttyTerminal:
    path: Vendor/libghostty-spm
targets:
  Companion:
    type: application
    platform: iOS
    sources: [Companion]
    dependencies:
      - package: GhosttyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.companion.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
