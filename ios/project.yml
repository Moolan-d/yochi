name: Companion
options:
  bundleIdPrefix: dev.companion
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Companion:
    type: application
    platform: iOS
    sources: [Companion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.companion.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
