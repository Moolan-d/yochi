name: Yochi
options:
  bundleIdPrefix: dev.yochi
  # The interface is written in English; Localizable.xcstrings adds Chinese.
  # Any other system language falls back to English.
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  # libghostty prebuilt for Apple platforms, at the revision Heeler pins.
  # Fetched by scripts/fetch-libghostty.sh (Xcode's own download can hang).
  GhosttyTerminal:
    path: Vendor/libghostty-spm
targets:
  Yochi:
    type: application
    platform: iOS
    sources: [Yochi]
    # Signing.xcconfig optionally includes the git-ignored Local.xcconfig
    # (DEVELOPMENT_TEAM, BUNDLE_ID_SUFFIX); see README.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: GhosttyTerminal
    info:
      # Generated by XcodeGen; merged with the build-setting keys below.
      path: Yochi/Info.plist
      properties:
        # ProMotion: without it iPhone holds every display link to 60 Hz,
        # including the terminal's, which asks for 120 while drawing and
        # scrolling.
        CADisableMinimumFrameDurationOnPhone: true
        # Lists both languages in iOS Settings > Yochi > Language.
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleURLTypes:
          # `yochi://pair?…` from the QR code `yochi pair` shows.
          - CFBundleURLName: dev.yochi.app
            CFBundleURLSchemes: [yochi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yochi.app$(BUNDLE_ID_SUFFIX)
        # The generated Info.plist takes its version from these; Settings
        # shows it under About.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Home-screen name.
        INFOPLIST_KEY_CFBundleDisplayName: Yochi
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos to send to an Agent.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  YochiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YochiTests
        excludes: [Fixtures]
      # A folder reference keeps the captures' directory layout in the bundle.
      - path: YochiTests/Fixtures
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - target: Yochi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yochi.tests$(BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
  YochiUITests:
    # Run through scripts/ui-test.sh, which starts a throwaway Gateway.
    type: bundle.ui-testing
    platform: iOS
    sources: [YochiUITests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - target: Yochi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yochi.uitests$(BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Yochi:
    build:
      targets:
        Yochi: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [YochiTests, YochiUITests]
      # The tests check the Chinese translation, so they run in Chinese on
      # any simulator. Running the app keeps the simulator's language.
      language: zh-Hans
      region: CN
    profile:
      config: Release
    archive:
      config: Release
